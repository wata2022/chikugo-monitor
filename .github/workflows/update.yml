name: Update monitor data

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: write

concurrency:
  group: update-monitor-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run regression tests
        run: |
          python -m unittest -v test_water_tide
          node --test test_security.mjs

      - name: Update water and tide data
        run: |
          mkdir -p docs
          python stage2_water_tide.py \
            --tide-csv tide_auto.csv \
            --merged-csv docs/merged.csv \
            --graph graph.png \
            --daily-graph-dir daily_graphs

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/merged.csv water_level.csv tide_auto.csv
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Update monitor data"
            git push
          fi
